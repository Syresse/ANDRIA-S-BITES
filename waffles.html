<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Waffles | Andria's Bites</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="favicon" type="image/png" href="favicon.png">
  <style>
    .order-container{
      max-width:600px;
      margin:4rem auto;
      background: var(--cream);
      padding:2.5rem;
      border-radius:20px;
      box-shadow:0 15px 35px rgba(59,36,23,0.35);
    }
    .order-container h2{
      text-align:center;
      margin-bottom:2rem;
    }
    label{font-weight:600; display:block; margin-top:1.2rem; color: var(--chocolate-dark);}
    select, input, textarea{
      width:100%;
      padding:0.7rem;
      margin-top:0.4rem;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:1rem;
    }
    .price{
      margin:1.5rem 0;
      font-size:1.3rem;
      font-weight:700;
      text-align:center;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <h1 class="brand">ANDRIA'S BITES</h1>
</nav>

<div class="order-container">
  <h2> Order Waffles </h2>

  <label>
    <input type="checkbox" id="bulkToggle" /> Bulk / Event Order
  </label>

  <div id="standardOrder">
    <label >Number of Pieces</label>
     <select id="package">
        <option value="">Select a preffered package </option>
      <option value="3">1 – GHS 5 </option>
      <option value="12">4 pcs – GHS 20</option>
      <option value="24">12 pcs – GHS 60</option>
    </select>
  </div>

  <div id="bulkOrder" style="display:none;">
    <label for="bulkQty">Quantity</label>
    <input type="number" id="bulkQty" min="10" placeholder="Enter total number of slices" />
    <p style="font-size:0.9rem; color: var(--chocolate-dark);">Price per slice: based on selection above</p>
  </div>

  <label for="name">Your Name</label>
  <input type="text" id="name" required />

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" required />

  <label for="delivery">Delivery Address</label>
  <textarea id="delivery" rows="2" placeholder="Street, City, Region" required></textarea>

  <label for="date">Delivery Date</label>
  <input type="date" id="date" required />

  
  <p class="payment-note">
    ⚠️ After submitting your order, you will receive a confirmation message on WhatsApp with payment instructions.
  </p>
  <p class="price">Total: GHS <span id="total">0</span></p>
 <a href="#" class="btn" onclick="event.preventDefault(); sendOrder();">Place Order</a>

</div>

<script src="data.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {

  const waffleData = products.find(p => p.type === "waffle");
  const slicesSelect = document.getElementById("package");
  const bulkToggle = document.getElementById("bulkToggle");
  const standardOrder = document.getElementById("standardOrder");
  const bulkOrder = document.getElementById("bulkOrder");
  const bulkQty = document.getElementById("bulkQty");
  const total = document.getElementById("total");

  // --- Populate dropdown dynamically ---
  // First, clear any existing options
  slicesSelect.innerHTML = '<option value="">Select a preferred package</option>';

  waffleData.options.forEach(option => {
    const opt = document.createElement("option");
    opt.textContent = `${option.slices} pcs – GHS ${option.price}`;
    opt.value = option.slices; // optional, for reference
    opt.setAttribute("data-price", option.price);
    slicesSelect.appendChild(opt);
  });

  // --- Function to update total ---
  function updateTotal() {
    let pricePerUnit = 0;
    let qty = 0;

    if (bulkToggle.checked) {
      // Bulk order
      qty = parseInt(bulkQty.value) || 0;

      // Use selected package price if any, otherwise first package price
      const selectedOption = slicesSelect.options[slicesSelect.selectedIndex];
      pricePerUnit = parseInt(selectedOption?.getAttribute("data-price")) || 0;

      total.textContent = qty * pricePerUnit;
    } else {
      // Standard order
      const selectedOption = slicesSelect.options[slicesSelect.selectedIndex];
      pricePerUnit = parseInt(selectedOption?.getAttribute("data-price")) || 0;
      total.textContent = pricePerUnit;
    }
  }

  // --- Event listeners ---
  bulkToggle.addEventListener('change', () => {
    if (bulkToggle.checked){
      standardOrder.style.display = 'none';
      bulkOrder.style.display = 'block';
    } else {
      standardOrder.style.display = 'block';
      bulkOrder.style.display = 'none';
    }
    updateTotal();
  });

  slicesSelect.addEventListener('change', updateTotal);
  bulkQty.addEventListener('input', updateTotal);

  // --- Send order to WhatsApp ---
  function sendOrder() {
    const packageSelect = slicesSelect;
    const selectedText = packageSelect.options[packageSelect.selectedIndex]?.text || "";

    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const delivery = document.getElementById('delivery').value.trim();
    const date = document.getElementById('date').value;

    if (!name || !phone || !delivery || !date) {
      alert("Please fill in all required fields.");
      return;
    }

    let orderDetails;

    if (bulkToggle.checked) {
      if (!bulkQty.value) {
        alert("Please enter bulk quantity.");
        return;
      }
      orderDetails = `Bulk Order – ${bulkQty.value} slices (Price per slice: GHS ${parseInt(packageSelect.options[packageSelect.selectedIndex]?.getAttribute("data-price") || 0)})`;
    } else {
      if (!packageSelect.value) {
        alert("Please select a package.");
        return;
      }
      orderDetails = `Standard Order – ${selectedText}`;
    }

    const message = `Hello Andria's Bites 👋

WAFFLE ORDER DETAILS:
• ${orderDetails}
• Delivery Address: ${delivery}
• Delivery Date: ${date}

Customer:
${name}
Phone: ${phone}`;

    const url = `https://wa.me/233201334826?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
  }

  window.sendOrder = sendOrder;

  // --- Initialize total ---
  updateTotal();
});
</script>
</body>
</html>
